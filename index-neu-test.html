
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swiss NHL League – Originaldesign Test</title>
<style>
body {
  margin: 0;
  background: #07101d;
  color: white;
  font-family: Arial, sans-serif;
}
#meldung {
  padding: 40px 20px;
  text-align: center;
}
</style>
</head>
<body>
<div id="meldung">
  <h2>Swiss NHL League</h2>
  <p>Originaldesign wird geladen …</p>
</div>
<script>
(async function () {
  const url =
    "https://raw.githubusercontent.com/" +
    "SwissNHLLeague/swiss-nhl-league/" +
    "22a6fb133436de17dd3c5629bc6e8c04e05d2366/" +
    "index.html";

  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error("Datei nicht erreichbar");

    const html = await response.text();

    if (!html.includes("Swiss NHL League")) {
      throw new Error("Originaldatei nicht erkannt");
    }

    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.getElementById("meldung").innerHTML =
      "<h2>Originaldesign konnte nicht geladen werden</h2>" +
      "<p>Die ursprüngliche Datei ist momentan nicht erreichbar.</p>";
  }
})();
</script>
</body>
</html>
