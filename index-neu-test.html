
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swiss NHL League – Arena Test</title>
<style>
body{margin:0;background:#07101d;color:white;font-family:Arial,sans-serif}
#loading{text-align:center;padding:50px 20px}
</style>
</head>
<body>
<div id="loading">
<h2>Swiss NHL League</h2>
<p>Originaldesign wird geladen …</p>
</div>
<script>
(async function(){
"use strict";

const url="https://raw.githubusercontent.com/SwissNHLLeague/swiss-nhl-league/22a6fb133436de17dd3c5629bc6e8c04e05d2366/index.html";

try{
 const response=await fetch(url);
 if(!response.ok)throw Error("Original nicht erreichbar");

 let html=await response.text();
 if(!html.includes("Swiss NHL League"))
   throw Error("Originaldatei ungültig");

 const style=`
 <style>
 .snhl-extra{
   max-width:1200px;margin:30px auto;
   padding:0 16px;color:white;
   font-family:Arial,sans-serif
 }
 .snhl-extra *{box-sizing:border-box}
 .snhl-panel{
   background:linear-gradient(145deg,#102c4c,#091726);
   border:1px solid #315b89;
   border-radius:12px;padding:20px;margin:16px 0
 }
 .snhl-grid{
   display:grid;
   grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
   gap:16px
 }
 .snhl-extra h2{color:white;font-size:23px}
 .snhl-empty{
   padding:18px;background:#10233a;
   border:1px dashed #41668c;border-radius:9px;
   color:#bdd1e8
 }
 .snhl-table{width:100%;border-collapse:collapse}
 .snhl-table td,.snhl-table th{
   padding:10px;border-bottom:1px solid #345575;
   text-align:left;color:white
 }
 </style>`;

 const content=`
 <div class="snhl-extra">
  <section class="snhl-panel" id="snhl-live">
   <h2>🔴 Live Scoreboard</h2>
   <div class="snhl-empty">
    Aktuell keine offiziellen Live-Ergebnisse verfügbar.
   </div>
  </section>

  <div class="snhl-grid">
   <section class="snhl-panel">
    <h2>📺 Twitch Live & Replays</h2>
    <div class="snhl-empty">
     Noch keine offiziellen Streams oder Replays verfügbar.
    </div>
   </section>
   <section class="snhl-panel">
    <h2>📅 Spielplan</h2>
    <div class="snhl-empty">
     Noch kein offizieller Spielplan verfügbar.
    </div>
   </section>
  </div>

  <div class="snhl-grid">
   <section class="snhl-panel">
    <h2>🏆 Tabellen</h2>
    <table class="snhl-table">
     <thead>
      <tr><th>#</th><th>Club</th><th>Sp.</th><th>Pts.</th></tr>
     </thead>
     <tbody>
      <tr><td colspan="4">Noch keine Tabelle verfügbar.</td></tr>
     </tbody>
    </table>
   </section>
   <section class="snhl-panel">
    <h2>🥅 Spielerstatistiken</h2>
    <div class="snhl-empty">
     Noch keine Spielerstatistiken verfügbar.
    </div>
   </section>
  </div>

  
 
 </div>`;

 if(!/<\/head\s*>/i.test(html) ||
    !/<\/body\s*>/i.test(html))
   throw Error("HTML-Struktur unvollständig");

 html=html.replace(/<\/head\s*>/i,style+"</head>");
 const clubsPosition =
  /<section\b(?=[^>]*\bid=["']clubs["'])[^>]*>/i;

if (!clubsPosition.test(html)) {
  throw Error("Clubbereich nicht gefunden");
}

html = html.replace(clubsPosition, match => content + match);

 document.open();
 document.write(html);
 document.close();

}catch(error){
 document.getElementById("loading").textContent=
  "Fehler beim Laden: "+error.message;
}
})();
</script>
</body>
</html>
