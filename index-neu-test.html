const scheduleCode = `
(function () {
  "use strict";

  const URL =
    "https://avvsnfgdmamhabcyngds.supabase.co";

  const KEY =
    "sb_publishable_xqTS7nztFKXTeyD7W-96QA_-7OCZ7Nt";

  async function loadSchedule() {
    const target = document.querySelector(
      "#snhl-schedule"
    );

    if (!target) return;

    target.textContent = "Spielplan wird geladen …";

    try {
      const headers = { apikey: KEY };

      const [gamesResponse, clubsResponse] =
        await Promise.all([
          fetch(
            URL + "/rest/v1/games" +
            "?select=id,season,game_mode,home_club_id," +
            "away_club_id,scheduled_at,status,match_type" +
            "&order=scheduled_at.asc",
            { headers }
          ),
          fetch(
            URL + "/rest/v1/public_clubs" +
            "?select=club_id,name",
            { headers }
          )
        ]);

      if (!gamesResponse.ok ||
          !clubsResponse.ok) {
        throw new Error(
          "Spieldaten konnten nicht geladen werden"
        );
      }

      const games = await gamesResponse.json();
      const clubs = await clubsResponse.json();

      const names = new Map(
        clubs.map(c => [c.club_id, c.name])
      );

      target.replaceChildren();

      if (!games.length) {
        target.textContent =
          "Noch keine Spiele veröffentlicht.";
        return;
      }

      games.forEach(game => {
        const card = document.createElement("article");
        card.style.background = "#10233a";
        card.style.border = "1px solid #315b89";
        card.style.borderRadius = "9px";
        card.style.padding = "15px";
        card.style.marginBottom = "12px";

        const title = document.createElement("strong");
        title.textContent =
          (names.get(game.home_club_id) || "Heimclub") +
          " vs. " +
          (names.get(game.away_club_id) || "Gastclub");

        const info = document.createElement("p");
        const date = new Date(game.scheduled_at);

        const formattedDate =
          new Intl.DateTimeFormat("de-CH", {
            timeZone: "Europe/Zurich",
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          }).format(date);

        info.textContent =
          formattedDate + " Uhr · " +
          game.game_mode + " · " +
          (game.match_type === "friendly"
            ? "Testspiel"
            : "Meisterschaft") +
          " · " +
          (game.status === "scheduled"
            ? "Geplant"
            : game.status);

        info.style.color = "#b9d2ed";
        info.style.marginBottom = "0";

        card.append(title, info);
        target.appendChild(card);
      });

    } catch (error) {
      target.textContent =
        "Spielplan konnte nicht geladen werden.";
      console.error(error);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      loadSchedule
    );
  } else {
    loadSchedule();
  }
})();
`;

const scheduleScript =
  "<scr" + "ipt>" +

  "</scr" + "ipt>";

html = html.replace(

const liveCode = `
(function () {
  "use strict";

  const URL =
    "https://avvsnfgdmamhabcyngds.supabase.co";

  const KEY =
    "sb_publishable_xqTS7nztFKXTeyD7W-96QA_-7OCZ7Nt";

  const headers = { apikey: KEY };

  const simulation =
    new URLSearchParams(location.search)
      .get("simulation") === "1";

  // Simulation und echte Daten getrennt halten.
  if (simulation) return;

  const periodNames = {
    "not_started": "Noch nicht gestartet",
    "1": "1. Drittel",
    "2": "2. Drittel",
    "3": "3. Drittel",
    "OT": "Verlängerung",
    "SO": "Penaltyschiessen",
    "finished": "Beendet"
  };

  function makeElement(tag, text, className) {
    const element = document.createElement(tag);

    if (text !== undefined && text !== null) {
      element.textContent = String(text);
    }

    if (className) element.className = className;

    return element;
  }

  function formatClock(seconds) {
    if (seconds === null || seconds === undefined) {
      return null;
    }

    const value = Number(seconds);

    if (!Number.isInteger(value) || value < 0) {
      return null;
    }

    const minutes = Math.floor(value / 60);
    const remainder = value % 60;

    return String(minutes).padStart(2, "0") +
      ":" +
      String(remainder).padStart(2, "0");
  }

  function makeTeam(club, fallback) {
    const team = makeElement("div");

    team.style.cssText =
      "flex:1;min-width:0;text-align:center;" +
      "overflow-wrap:anywhere";

    if (club && club.logo_url &&
        /^https:\\/\\//i.test(club.logo_url)) {
      const logo = document.createElement("img");

      logo.src = club.logo_url;
      logo.alt = "Clublogo";
      logo.loading = "lazy";

      logo.style.cssText =
        "width:72px;height:72px;" +
        "object-fit:contain;display:block;" +
        "margin:0 auto 10px";

      team.appendChild(logo);
    }

    const name = makeElement(
      "div",
      club && club.name ? club.name : fallback
    );

    name.style.cssText =
      "font-size:14px;font-weight:bold;line-height:1.4";

    team.appendChild(name);

    return team;
  }

  async function loadLiveScores() {
    const target = document.getElementById(
      "snhl-live-results"
    );

    if (!target) return;

    try {
      const [gamesResponse, clubsResponse, liveResponse] =
        await Promise.all([
          fetch(
            URL + "/rest/v1/games" +
            "?select=id,game_mode,home_club_id," +
            "away_club_id,home_score,away_score," +
            "status,scheduled_at,decision_type" +
            "&status=in.(in_progress,completed)" +
            "&order=scheduled_at.desc&limit=20",
            { headers, cache: "no-store" }
          ),

          fetch(
            URL + "/rest/v1/public_clubs" +
            "?select=club_id,name,logo_url",
            { headers, cache: "no-store" }
          ),

          fetch(
            URL + "/rest/v1/game_live_state" +
            "?select=game_id,period,clock_seconds," +
            "clock_running,updated_at",
            { headers, cache: "no-store" }
          )
        ]);

      if (!gamesResponse.ok ||
          !clubsResponse.ok ||
          !liveResponse.ok) {
        throw new Error("Supabase-Abfrage fehlgeschlagen");
      }

      const [games, clubs, liveStates] =
        await Promise.all([
          gamesResponse.json(),
          clubsResponse.json(),
          liveResponse.json()
        ]);

      const clubMap = new Map(
        clubs.map(club => [club.club_id, club])
      );

      const liveMap = new Map(
        liveStates.map(state => [
          state.game_id,
          state
        ])
      );

      const fragment = document.createDocumentFragment();

      if (!games.length) {
        const empty = makeElement(
          "div",
          "Aktuell keine laufenden oder abgeschlossenen Spiele.",
          "snhl-empty"
        );

        fragment.appendChild(empty);
        target.replaceChildren(fragment);
        return;
      }

      games.forEach(game => {
        const state = liveMap.get(game.id);

        const card = makeElement("article");

        card.style.cssText =
          "background:#10233a;" +
          "border:1px solid #315b89;" +
          "border-radius:12px;" +
          "padding:18px;margin-bottom:12px";

        const header = makeElement(
          "div",
          game.status === "in_progress"
            ? "🔴 LIVE · " + game.game_mode
            : "BEENDET · " + game.game_mode
        );

        header.style.cssText =
          "font-weight:bold;color:" +
          (game.status === "in_progress"
            ? "#ff8585"
            : "#a9c8e8") +
          ";margin-bottom:18px";

        const teams = makeElement("div");

        teams.style.cssText =
          "display:flex;align-items:center;" +
          "justify-content:space-between;" +
          "gap:8px";

        const home = makeTeam(
          clubMap.get(game.home_club_id),
          "Heimclub"
        );

        const away = makeTeam(
          clubMap.get(game.away_club_id),
          "Gastclub"
        );

        const middle = makeElement("div");
        middle.style.cssText =
          "text-align:center;flex:0 0 auto;min-width:84px;" +
          "display:flex;flex-direction:column;align-items:center;gap:7px";

        const phase = makeElement(
          "div",
          game.status === "completed"
            ? "Spiel beendet"
            : state
              ? (periodNames[state.period] || "Spielphase unbekannt")
              : "Live"
        );
        phase.style.cssText =
          "font-size:13px;font-weight:bold;color:#c5dcf5;" +
          "overflow-wrap:anywhere";

        const hasScore =
          game.home_score !== null &&
          game.away_score !== null;
        const score = makeElement(
          "div",
          hasScore
            ? game.home_score + " : " + game.away_score
            : "– : –"
        );
        score.style.cssText =
          "font-size:clamp(23px,5vw,34px);font-weight:800;" +
          "white-space:nowrap;font-variant-numeric:tabular-nums";

        middle.append(phase, score);

        if (game.status === "in_progress" && state) {
          const clock = formatClock(state.clock_seconds);
          if (clock !== null) {
            const clockDisplay = makeElement("div", clock);
            clockDisplay.style.cssText =
              "font-size:22px;font-weight:bold;color:#e0efff;" +
              "font-variant-numeric:tabular-nums";
            middle.appendChild(clockDisplay);

            const clockStatus = makeElement(
              "div",
              state.clock_running ? "Uhr läuft" : "Pause"
            );
            clockStatus.style.cssText =
              "font-size:12px;color:#b9d2ed";
            middle.appendChild(clockStatus);
          }
        }

        teams.append(home, middle, away);
        card.append(header, teams);

        if (game.status === "completed" &&
            game.decision_type) {
          const decision = makeElement(
            "div",
            "Entscheidung: " + game.decision_type
          );

          decision.style.cssText =
            "text-align:center;margin-top:12px;" +
            "color:#a9c8e8";

          card.appendChild(decision);
        }

        fragment.appendChild(card);
      });

      target.replaceChildren(fragment);

    } catch (error) {
      console.error("Live-Scoreboard:", error);

      if (!target.querySelector("article")) {
        const empty = makeElement(
          "div",
          "Live-Ergebnisse konnten nicht geladen werden.",
          "snhl-empty"
        );

        target.replaceChildren(empty);
      }
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      loadLiveScores
    );
  } else {
    loadLiveScores();
  }

  setInterval(loadLiveScores, 5000);
})();
`;


const liveScript =

const clockSimulationCode = `

(function () {
  "use strict";

  if (
    new URLSearchParams(location.search)
      .get("simulation") !== "1"
  ) return;

  const target = document.getElementById(
    "snhl-live-results"
  );

  if (!target) return;

  let attempts = 0;

  const finder = setInterval(function () {
    const card = target.querySelector("article");

    if (!card) {
      if (++attempts >= 20) clearInterval(finder);
      return;
    }

    clearInterval(finder);

    let period = "2";
    let remaining = 754;
    let running = false;
    let lastTick = 0;

    const panel = document.createElement("div");
    panel.style.cssText =
      "margin-top:18px;padding-top:15px;" +
      "border-top:1px solid #315b89;" +
      "text-align:center";

    const title = document.createElement("div");
    title.style.fontWeight = "bold";

    const clock = document.createElement("div");
    clock.style.cssText =
      "font-size:32px;font-weight:bold;" +
      "margin:12px 0;font-variant-numeric:tabular-nums";

    const controls = document.createElement("div");
    controls.style.cssText =
      "display:flex;flex-wrap:wrap;" +
      "justify-content:center;gap:8px";

    function button(label, action) {
      const b = document.createElement("button");
      b.textContent = label;
      b.style.cssText =
        "background:#1683ff;color:white;" +
        "border:0;border-radius:8px;" +
        "padding:11px;cursor:pointer";
      b.addEventListener("click", action);
      controls.appendChild(b);
      return b;
    }

    function render() {
    const finished = period === "finished";

Array.from(controls.children).forEach(function (b) {
  b.style.display =
    !finished || b.textContent.includes("Zurücksetzen")
      ? ""
      : "none";
});
      const names = {
        "1": "1. Drittel",
        "2": "2. Drittel",
        "3": "3. Drittel",
        OT: "Verlängerung",
        SO: "Penaltyschiessen",
finished: "Spiel beendet"
      };

      title.textContent =
  (names[period] || period) +
  (period === "finished" ? "" :
    running ? " · Uhr läuft" : " · Pause");

      const m = Math.floor(remaining / 60);
      const s = remaining % 60;

      clock.textContent =
        String(m).padStart(2, "0") + ":" +
        String(s).padStart(2, "0");
    }

    button("▶ Start", function () {
      if (remaining > 0 && period !== "SO") {
        running = true;
        lastTick = Date.now();
        render();
      }
    });

    button("⏸ Pause", function () {
      running = false;
      render();
    });

    
button("↻ Zurücksetzen", function () {
  running = false;
  period = "1";
  remaining = 1200;
  render();
});


    button("Nächstes Drittel", function () {
      running = false;

      const order = ["1", "2", "3", "OT", "SO", "finished"];
const index = order.indexOf(period);

period = order[Math.min(index + 1, 5)];
remaining = period === "SO" || period === "finished" ? 0 : 1200;
      render();
    });

    const center = card.querySelector("#snhl-score-center");
    if (center) {
      center.prepend(title);
      center.appendChild(clock);
      title.style.cssText =
        "font-weight:bold;font-size:clamp(11px,2.8vw,15px);" +
        "line-height:1.3;white-space:normal";
      clock.style.cssText =
        "font-size:clamp(17px,4.5vw,27px);font-weight:bold;" +
        "margin:4px 0 0;font-variant-numeric:tabular-nums";
      panel.appendChild(controls);
    } else {
      panel.append(title, clock, controls);
    }
    card.appendChild(panel);

    render();

    const timer = setInterval(function () {
      if (!panel.isConnected) {
        clearInterval(timer);
        return;
      }

      if (!running) return;

      const now = Date.now();
      const elapsed = Math.floor((now - lastTick) / 1000);

      if (elapsed < 1) return;

      remaining = Math.max(0, remaining - elapsed);
      lastTick += elapsed * 1000;

      if (remaining === 0) running = false;

      render();
    }, 250);
  }, 200);
})();
`;

  const target = document.getElementById(
    "snhl-live-results"
  );

  if (!target) return;

  let homeScore = 2;
  let awayScore = 1;
  let seconds = 0;

  // Eigener Testbereich statt Änderung echter Daten
  const test = document.createElement("article");
  test.style.cssText =
    "background:#10233a;border:2px solid #ffb347;" +
    "border-radius:12px;padding:18px;margin-bottom:12px";

  const heading = document.createElement("h3");
  heading.textContent =
    "TESTSIMULATION – kein echtes Ligaspiel";
  heading.style.color = "#ffcf88";

  const teams = document.createElement("p");
  teams.textContent =
    "Swiss NHL Testclub 2 vs. Swiss NHL Testclub Zürich";


  // Clublogos werden unabhängig vom Spielstand geladen.
  const logoRow = document.createElement("div");
  logoRow.style.cssText =
    "display:flex;justify-content:space-around;" +
    "align-items:center;gap:16px;margin:14px 0;" +
    "min-height:68px";

  function logoSlot(name) {
    const slot = document.createElement("div");
    slot.style.cssText = "flex:1;text-align:center;min-width:0";
    const img = document.createElement("img");
    img.alt = "Logo " + name;
    img.style.cssText =
      "width:68px;height:68px;object-fit:contain;" +
      "display:none;margin:auto";
    const placeholder = document.createElement("div");
    placeholder.textContent = "🏒";
    placeholder.style.cssText =
      "font-size:28px;line-height:68px;opacity:.65";
    img.addEventListener("error", function () {
      img.style.display = "none";
      placeholder.style.display = "block";
    });
    const clubName = document.createElement("div");
    clubName.textContent = name;
    clubName.style.cssText =
      "font-size:clamp(10px,2.7vw,13px);font-weight:600;" +
      "line-height:1.3;margin-top:7px;overflow-wrap:anywhere;" +
      "color:#e3efff";
    slot.append(img, placeholder, clubName);
    return { img: img, placeholder: placeholder, slot: slot };
  }

  const homeLogo = logoSlot("Swiss NHL Testclub 2");
  const awayLogo = logoSlot("Swiss NHL Testclub Zürich");
  // Logos und Resultat werden unten gemeinsam angeordnet.

  async function loadSimulationLogos() {
    try {
      const response = await fetch(
        "https://avvsnfgdmamhabcyngds.supabase.co/rest/v1/public_clubs" +
        "?select=name,logo_url",
        {
          headers: {
            apikey: "sb_publishable_xqTS7nztFKXTeyD7W-96QA_-7OCZ7Nt"
          },
          cache: "no-store"
        }
      );
      if (!response.ok) throw new Error("HTTP " + response.status);
      const clubs = await response.json();
      function applyLogo(slot, clubName) {
        const club = clubs.find(function (c) {
          return String(c.name || "").trim().toLowerCase() ===
            clubName.toLowerCase();
        });
        const url = club && typeof club.logo_url === "string"
          ? club.logo_url.trim() : "";
        if (!url.startsWith("https://")) return;
        slot.img.addEventListener("load", function () {
          slot.placeholder.style.display = "none";
          slot.img.style.display = "block";
        }, { once: true });
        slot.img.src = url;
      }
      applyLogo(homeLogo, "Swiss NHL Testclub 2");
      applyLogo(awayLogo, "Swiss NHL Testclub Zürich");
    } catch (error) {
      console.error("Testclub-Logos:", error);
    }
  }

  const score = document.createElement("h2");
  score.style.cssText =
    "flex:0 0 auto;min-width:88px;text-align:center;" +
    "font-size:clamp(23px,6vw,36px);font-weight:800;" +
    "white-space:nowrap;margin:0;font-variant-numeric:tabular-nums";
  logoRow.style.justifyContent = "space-between";
  logoRow.style.gap = "6px";
  const center = document.createElement("div");
  center.id = "snhl-score-center";
  center.style.cssText =
    "flex:1.3;min-width:105px;text-align:center;" +
    "display:flex;flex-direction:column;" +
    "align-items:center;justify-content:center;gap:3px";
  center.appendChild(score);
  logoRow.append(homeLogo.slot, center, awayLogo.slot);
  const timer = document.createElement("p");
  const status = document.createElement("p");
  status.textContent = "🔴 SIMULATION";
  status.style.color = "#ff8b8b";

  const button = document.createElement("button");
  button.textContent = "Testtor Heimclub +1";
  button.style.cssText =
    "background:#1683ff;color:white;border:0;" +
    "border-radius:8px;padding:12px;cursor:pointer";

  function render() {
    score.textContent = homeScore + " : " + awayScore;
    timer.textContent =
      "Testzeit: " + seconds + " Sekunden";
  }

  button.addEventListener("click", function () {
    homeScore++;
    render();
  });

  test.append(
    heading, teams, logoRow, timer, status, button
  );
target.querySelectorAll(".snhl-empty").forEach(
  element => element.remove()
);
  target.prepend(test);
  render();
  loadSimulationLogos();

  
const testUrl =
  "https://avvsnfgdmamhabcyngds.supabase.co";

const testKey =
  "sb_publishable_xqTS7nztFKXTeyD7W-96QA_-7OCZ7Nt";

async function refreshTestScore() {
  try {
    const response = await fetch(
      testUrl +
      "/rest/v1/snhl_live_test" +
      "?select=home_score,away_score&id=eq.1",
      {
        headers: {
          apikey: testKey
        },
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const rows = await response.json();

    if (rows.length) {
      homeScore = rows[0].home_score;
      awayScore = rows[0].away_score;
      render();
    }
  } catch (error) {
    console.error("Testdaten konnten nicht geladen werden", error);
  }
}

refreshTestScore();

const interval = setInterval(function () {
  if (!test.isConnected) {
    clearInterval(interval);
    return;
  }

  seconds += 5;
  refreshTestScore();
  render();
}, 5000);

})();
