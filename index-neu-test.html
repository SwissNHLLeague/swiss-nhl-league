<script>
(async function () {
"use strict";

const ORIGINAL =
"https://raw.githubusercontent.com/SwissNHLLeague/swiss-nhl-league/22a6fb133436de17dd3c5629bc6e8c04e05d2366/index.html";

const URL =
"https://avvsnfgdmamhabcyngds.supabase.co";

const KEY =
"sb_publishable_xqTS7nztFKXTeyD7W-96QA_-7OCZ7Nt";

const headers = {
  apikey: KEY
};

const params = new URLSearchParams(location.search);

const liveTest = params.get("live_test") === "1";
const simulation = params.get("simulation") === "1";

function element(tag, content) {
  const e = document.createElement(tag);
  if (content !== undefined) {
    e.textContent = String(content);
  }
  return e;
}

function formatClock(value) {
  const seconds = Math.max(0, Math.floor(Number(value) || 0));
  return String(Math.floor(seconds / 60)).padStart(2, "0") +
    ":" + String(seconds % 60).padStart(2, "0");
}

function decisionSuffix(value) {
  const type = String(value || "").toLowerCase();

  if (["ot", "overtime", "nv", "n.v."].includes(type)) {
    return " n.V.";
  }

  if (["so", "shootout", "np", "n.p."].includes(type)) {
    return " n.P.";
  }

  return "";
}

async function getRows(table, query) {
  const response = await fetch(
    URL + "/rest/v1/" + table + "?" + query,
    {
      headers,
      cache: "no-store"
    }
  );

  if (!response.ok) {
    throw new Error("Supabase HTTP " + response.status);
  }

  return response.json();
}

function teamElement(name, logoUrl) {
  const box = element("div");
  box.className = "snhl-team";

  if (logoUrl && /^https:\/\//i.test(logoUrl)) {
    const img = element("img");
    img.src = logoUrl;
    img.alt = "Clublogo";
    img.loading = "lazy";
    img.className = "snhl-team-logo";
    box.appendChild(img);
  }

  const label = element("div", name);
  box.appendChild(label);

  return box;
}

function resultCard(home, away, result, phase, time) {
  const card = element("article");
  card.className = "snhl-result-card";

  const row = element("div");
  row.className = "snhl-score-row";

  const center = element("div");
  center.className = "snhl-score-center";

  const phaseLabel = element("div", phase);
  phaseLabel.className = "snhl-phase";

  const scoreLabel = element("div", result);
  scoreLabel.className = "snhl-score";

  const clockLabel = element("div", time || "");
  clockLabel.className = "snhl-clock";

  center.append(phaseLabel, scoreLabel, clockLabel);

  row.append(
    teamElement(home.name, home.logo_url),
    center,
    teamElement(away.name, away.logo_url)
  );

  card.appendChild(row);

  return {
    card,
    phaseLabel,
    scoreLabel,
    clockLabel
  };
}

function findClub(clubs, name) {
  const normalized = String(name).trim().toLowerCase();

  return clubs.find(club =>
    String(club.name || "").trim().toLowerCase() === normalized
  ) || {
    name,
    logo_url: null
  };
}

async function loadClubs() {
  const target = document.getElementById("clubs");
  if (!target) return;

  try {
    const clubs = await getRows(
      "public_clubs",
      "select=club_id,name,country_code,logo_url,player_count&order=name.asc"
    );

    const oldDescription = target.querySelector("p");

    if (
      oldDescription &&
      oldDescription.textContent.includes("Clubprofile und Anmeldungen")
    ) {
      oldDescription.remove();
    }

    const existing = target.querySelector(".snhl-club-grid");
    if (existing) existing.remove();

    const grid = element("div");
    grid.className = "snhl-club-grid";

    for (const club of clubs) {
      const card = element("article");
      card.className = "snhl-club-card";

      const info = element("div");
      info.style.flex = "1";
      info.style.minWidth = "160px";

      const name = element("h3", club.name || "Unbenannter Club");

      const count = Number(club.player_count) || 0;

      const players = element(
        "p",
        count + " aktive Spieler"
      );

      players.style.color =
        count >= 7 && count <= 15 ? "#70e6a0" : "#ff8b8b";

      const country = element("p");

      const code = String(club.country_code || "")
        .trim()
        .toUpperCase();

      if (/^[A-Z]{2}$/.test(code)) {
        const flag = [...code]
          .map(letter =>
            String.fromCodePoint(
              127397 + letter.charCodeAt(0)
            )
          )
          .join("");

        let countryName = code;

        try {
          countryName = new Intl.DisplayNames(
            ["de"],
            { type: "region" }
          ).of(code);
        } catch (_) {}

        country.textContent =
          flag + " " + countryName;
      } else {
        country.textContent = "Land nicht angegeben";
      }

      name.style.margin = "0 0 6px";
      country.style.margin = "0 0 5px";
      players.style.margin = "0";

      info.append(name, country, players);

      if (
        club.logo_url &&
        /^https:\/\//i.test(club.logo_url)
      ) {
        const img = element("img");
        img.src = club.logo_url;
        img.alt = "Clublogo";
        img.className = "snhl-club-logo";
        card.appendChild(img);
      }

      card.appendChild(info);
      grid.appendChild(card);
    }

    if (!clubs.length) {
      grid.appendChild(
        element("p", "Noch keine Clubs vorhanden.")
      );
    }

    target.appendChild(grid);

  } catch (error) {
    console.error("Clubübersicht:", error);
  }
}

async function loadSchedule() {
  const target = document.getElementById("snhl-schedule");
  if (!target) return;

  try {
    const [games, clubs] = await Promise.all([
      getRows(
        "games",
        "select=id,season,game_mode,home_club_id,away_club_id,scheduled_at,status,match_type&order=scheduled_at.asc"
      ),
      getRows(
        "public_clubs",
        "select=club_id,name"
      )
    ]);

    const names = new Map(
      clubs.map(c => [c.club_id, c.name])
    );

    target.replaceChildren();

    if (!games.length) {
      target.textContent = "Noch keine Spiele veröffentlicht.";
      return;
    }

    for (const game of games) {
      const card = element("article");
      card.className = "snhl-schedule-card";

      const home = names.get(game.home_club_id) || "Heimclub";
      const away = names.get(game.away_club_id) || "Gastclub";

      const title = element(
        "strong",
        home + " vs. " + away
      );

      const date = new Date(game.scheduled_at);

      const formattedDate = Number.isFinite(date.getTime())
        ? new Intl.DateTimeFormat("de-CH", {
            timeZone: "Europe/Zurich",
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          }).format(date)
        : "Datum unbekannt";

      const info = element(
        "p",
        formattedDate + " Uhr · " +
        (game.game_mode || "") + " · " +
        (game.match_type === "friendly"
          ? "Testspiel"
          : "Meisterschaft") + " · " +
        (game.status === "scheduled"
          ? "Geplant"
          : game.status)
      );

      info.style.color = "#b9d2ed";
      info.style.marginBottom = "0";

      card.append(title, info);
      target.appendChild(card);
    }

  } catch (error) {
    console.error("Spielplan:", error);
    target.textContent =
      "Spielplan konnte nicht geladen werden.";
  }
}

function startLiveTest() {
  const target = document.getElementById("snhl-live-results");
  if (!target) return;

  const heading = element(
    "h3",
    "TESTANZEIGE – keine echten Ligadaten"
  );

  heading.style.color = "#ffcf88";

  const note = element(
    "p",
    "Separater Supabase-Test · Aktualisierung alle 5 Sekunden"
  );

  note.style.color = "#bdd1e8";
  note.style.textAlign = "center";

  let view = null;
  let clockState = null;
  let busy = false;

  const periodNames = {
    "1": "1. Drittel",
    "2": "2. Drittel",
    "3": "3. Drittel",
    "OT": "Verlängerung",
    "SO": "Penaltyschiessen",
    "finished": "Spiel beendet"
  };

  function renderClock() {
    if (!clockState || !view) return;

    const state = clockState;

    let seconds = state.seconds;

    if (
      state.running &&
      state.period !== "finished" &&
      state.period !== "SO"
    ) {
      seconds = Math.max(
        0,
        state.seconds -
        Math.floor((Date.now() - state.since) / 1000)
      );
    }

    view.clockLabel.textContent = formatClock(seconds);

    const specialEnd =
      state.period === "finished" &&
      state.endedInOt === true &&
      ["3vs3", "6vs6"].includes(state.gameMode);

    if (specialEnd) {
      const elapsed = Date.now() - state.finishedAt;

      view.phaseLabel.textContent =
        elapsed >= 120000
          ? "ENDE"
          : "Spiel beendet";

      return;
    }

    if (state.period === "finished") {
      view.phaseLabel.textContent = "Spiel beendet";
      return;
    }

    const periodName =
      periodNames[state.period] || state.period;

    let status = " · Pause";

    if (state.running && seconds > 0) {
      status = " · Uhr läuft";
    } else if (
      state.period === "1" &&
      seconds === 1200
    ) {
      status = " · Spielbeginn";
    }

    view.phaseLabel.textContent = periodName + status;
  }

  async function refresh() {
    if (busy) return;
    busy = true;

    try {
      const [rows, clubs] = await Promise.all([
        getRows(
          "snhl_live_display_test",
          "select=home_score,away_score,period,clock_seconds,clock_running,updated_at,game_mode,ended_in_ot,finished_at,decision_type&id=eq.1"
        ),
        getRows(
          "public_clubs",
          "select=name,logo_url"
        )
      ]);

      if (!rows.length) {
        throw new Error("Testdatensatz fehlt.");
      }

      const d = rows[0];

      const home = findClub(
        clubs,
        "Swiss NHL Testclub 2"
      );

      const away = findClub(
        clubs,
        "Swiss NHL Testclub Zürich"
      );

      const result =
        String(d.home_score ?? 0) +
        " : " +
        String(d.away_score ?? 0) +
        (d.period === "finished"
          ? decisionSuffix(d.decision_type)
          : "");

      if (!view) {
        view = resultCard(
          home,
          away,
          result,
          "Laden …",
          "00:00"
        );

        view.card.classList.add("snhl-test-card");

        target.replaceChildren(
          heading,
          view.card,
          note
        );
      }

      view.scoreLabel.textContent = result;

      const updated = Date.parse(d.updated_at);
      const finished = Date.parse(d.finished_at);

      clockState = {
        period: String(d.period),
        seconds: Math.max(
          0,
          Number(d.clock_seconds) || 0
        ),
        running: d.clock_running === true,
        since: Number.isFinite(updated)
          ? updated
          : Date.now(),
        gameMode: String(d.game_mode || "6vs6"),
        endedInOt: d.ended_in_ot === true,
        finishedAt: Number.isFinite(finished)
          ? finished
          : Number.isFinite(updated)
            ? updated
            : Date.now()
      };

      renderClock();

      note.textContent =
        "Separater Supabase-Test · automatische Aktualisierung alle 5 Sekunden";

    } catch (error) {
      console.error("Live-Test:", error);
      note.textContent =
        "Testdaten konnten nicht geladen werden: " +
        error.message;
    } finally {
      busy = false;
    }
  }

  refresh();

  const refreshTimer = setInterval(refresh, 5000);
  const clockTimer = setInterval(renderClock, 250);

  window.addEventListener("pagehide", function () {
    clearInterval(refreshTimer);
    clearInterval(clockTimer);
  }, { once: true });
}

function startRegularLive() {
  const target = document.getElementById("snhl-live-results");
  if (!target) return;

  async function refresh() {
    try {
      const [games, clubs, states] = await Promise.all([
        getRows(
          "games",
          "select=id,game_mode,home_club_id,away_club_id,home_score,away_score,status,scheduled_at,decision_type&status=in.(in_progress,completed)&order=scheduled_at.desc&limit=20"
        ),
        getRows(
          "public_clubs",
          "select=club_id,name,logo_url"
        ),
        getRows(
          "game_live_state",
          "select=game_id,period,clock_seconds,clock_running,updated_at"
        )
      ]);

      const clubMap = new Map(
        clubs.map(c => [c.club_id, c])
      );

      const stateMap = new Map(
        states.map(s => [s.game_id, s])
      );

      target.replaceChildren();

      if (!games.length) {
        const empty = element(
          "div",
          "Aktuell keine laufenden oder abgeschlossenen Spiele."
        );

        empty.className = "snhl-empty";
        target.appendChild(empty);
        return;
      }

      for (const game of games) {
        const home = clubMap.get(game.home_club_id) || {
          name: "Heimclub"
        };

        const away = clubMap.get(game.away_club_id) || {
          name: "Gastclub"
        };

        const state = stateMap.get(game.id);

        const finished = game.status === "completed";

        const result =
          game.home_score === null ||
          game.away_score === null
            ? "– : –"
            : game.home_score + " : " +
              game.away_score +
              (finished
                ? decisionSuffix(game.decision_type)
                : "");

        const phase = finished
          ? "Spiel beendet"
          : state
            ? ({
                "1": "1. Drittel",
                "2": "2. Drittel",
                "3": "3. Drittel",
                "OT": "Verlängerung",
                "SO": "Penaltyschiessen"
              }[state.period] || "Live")
            : "Live";

        const time = state && !finished
          ? formatClock(state.clock_seconds)
          : "";

        const view = resultCard(
          home,
          away,
          result,
          phase,
          time
        );

        const header = element(
          "div",
          (finished ? "BEENDET · " : "🔴 LIVE · ") +
          game.game_mode
        );

        header.style.cssText =
          "font-weight:bold;color:#a9c8e8;margin-bottom:16px";

        view.card.prepend(header);
        target.appendChild(view.card);
      }

    } catch (error) {
      console.error("Live Scoreboard:", error);

      if (!target.querySelector("article")) {
        const empty = element(
          "div",
          "Live-Ergebnisse konnten nicht geladen werden."
        );

        empty.className = "snhl-empty";
        target.replaceChildren(empty);
      }
    }
  }

  refresh();
  setInterval(refresh, 5000);
}

function startSimulation() {
  const target = document.getElementById("snhl-live-results");
  if (!target) return;

  let homeScore = 2;
  let awayScore = 1;
  let period = "2";
  let seconds = 754;
  let running = false;
  let lastTick = Date.now();

  const home = {
    name: "Swiss NHL Testclub 2"
  };

  const away = {
    name: "Swiss NHL Testclub Zürich"
  };

  const view = resultCard(
    home,
    away,
    "2 : 1",
    "2. Drittel · Pause",
    formatClock(seconds)
  );

  const heading = element(
    "h3",
    "TESTSIMULATION – kein echtes Ligaspiel"
  );

  heading.style.color = "#ffcf88";

  const controls = element("div");
  controls.className = "snhl-controls";

  function button(label, action) {
    const b = element("button", label);
    b.type = "button";
    b.addEventListener("click", action);
    controls.appendChild(b);
  }

  function render() {
    view.scoreLabel.textContent =
      homeScore + " : " + awayScore;

    view.clockLabel.textContent = formatClock(seconds);

    const names = {
      "1": "1. Drittel",
      "2": "2. Drittel",
      "3": "3. Drittel",
      "OT": "Verlängerung",
      "SO": "Penaltyschiessen",
      "finished": "Spiel beendet"
    };

    view.phaseLabel.textContent =
      (names[period] || period) +
      (period === "finished"
        ? ""
        : running ? " · Uhr läuft" : " · Pause");
  }

  button("▶ Start", function () {
    if (seconds > 0 && period !== "finished") {
      running = true;
      lastTick = Date.now();
      render();
    }
  });

  button("⏸ Pause", function () {
    running = false;
    render();
  });

  button("↻ Zurücksetzen", function () {
    running = false;
    period = "1";
    seconds = 1200;
    homeScore = 0;
    awayScore = 0;
    render();
  });

  button("Nächstes Drittel", function () {
    running = false;

    const order = [
      "1", "2", "3", "OT", "SO", "finished"
    ];

    const index = order.indexOf(period);
    period = order[Math.min(index + 1, 5)];

    seconds =
      period === "finished" || period === "SO"
        ? 0
        : 1200;

    render();
  });

  button("Testtor Heimclub +1", function () {
    homeScore++;
    render();
  });

  view.card.appendChild(controls);
  target.replaceChildren(heading, view.card);

  render();

  setInterval(function () {
    if (!running) return;

    const now = Date.now();
    const elapsed = Math.floor(
      (now - lastTick) / 1000
    );

    if (elapsed < 1) return;

    seconds = Math.max(0, seconds - elapsed);
    lastTick += elapsed * 1000;

    if (seconds === 0) running = false;

    render();
  }, 250);

  getRows(
    "public_clubs",
    "select=name,logo_url"
  ).then(clubs => {
    const h = findClub(clubs, home.name);
    const a = findClub(clubs, away.name);

    const row = view.card.querySelector(".snhl-score-row");

    row.replaceChild(
      teamElement(h.name, h.logo_url),
      row.children[0]
    );

    row.replaceChild(
      teamElement(a.name, a.logo_url),
      row.children[2]
    );
  }).catch(console.error);
}

      </tr>
    </thead>
    <tbody>
      <tr>
        <td colspan="4">
          Noch keine Tabelle verfügbar.
        </td>
      </tr>
    </tbody>
  </table>
</section>

<section class="snhl-panel">
  <h2>🥅 Spielerstatistiken</h2>
  <div class="snhl-empty">
    Noch keine Spielerstatistiken verfügbar.
  </div>

</div>
</div>
`;

try {
  const response = await fetch(ORIGINAL);

  if (!response.ok) {
    throw new Error("Originaldesign nicht erreichbar.");
  }

  let html = await response.text();

  if (!html.includes("Swiss NHL League")) {
    throw new Error("Originaldesign ungültig.");
  }

  const clubPosition =
    /<section\b(?=[^>]*\bid=["']clubs["'])[^>]*>/i;

  if (!clubPosition.test(html)) {
    throw new Error("Clubbereich nicht gefunden.");
  }

  html = html.replace(
    /<\/head\s*>/i,
    css + "</head>"
  );

  html = html.replace(
    clubPosition,
    match => content + match
  );

  document.open();
  document.write(html);
  document.close();

  const initialize = function () {
    loadClubs();
    loadSchedule();

    if (liveTest) {
      startLiveTest();
    } else if (simulation) {
      startSimulation();
    } else {
      startRegularLive();
    }
  };

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      initialize,
      { once: true }
    );
  } else {
    initialize();
  }

} catch (error) {
  const loading = document.getElementById("loading");

  if (loading) {
    loading.textContent =
      "Fehler beim Laden: " + error.message;
  }

  console.error(error);
}

})();
</script>

</body>
</html>
