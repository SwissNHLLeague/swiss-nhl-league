
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swiss NHL League – Arena Test</title>
<style>
body{margin:0;background:#07101d;color:white;font-family:Arial,sans-serif}
#loading{text-align:center;padding:50px 20px}
</style>
</head>
<body>
<div id="loading">
<h2>Swiss NHL League</h2>
<p>Originaldesign wird geladen …</p>
</div>
<script>
(async function(){
"use strict";

const url="https://raw.githubusercontent.com/SwissNHLLeague/swiss-nhl-league/22a6fb133436de17dd3c5629bc6e8c04e05d2366/index.html";

try{
 const response=await fetch(url);
 if(!response.ok)throw Error("Original nicht erreichbar");

 let html=await response.text();
 if(!html.includes("Swiss NHL League"))
   throw Error("Originaldatei ungültig");

 const style=`
 <style>
 .snhl-extra{
   max-width:1200px;margin:30px auto;
   padding:0 16px;color:white;
   font-family:Arial,sans-serif
 }
 .snhl-extra *{box-sizing:border-box}
 .snhl-panel{
   background:linear-gradient(145deg,#102c4c,#091726);
   border:1px solid #315b89;
   border-radius:12px;padding:20px;margin:16px 0
 }
 .snhl-grid{
   display:grid;
   grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
   gap:16px
 }
 .snhl-extra h2{color:white;font-size:23px}
 .snhl-empty{
   padding:18px;background:#10233a;
   border:1px dashed #41668c;border-radius:9px;
   color:#bdd1e8
 }
 .snhl-table{width:100%;border-collapse:collapse}
 .snhl-table td,.snhl-table th{
   padding:10px;border-bottom:1px solid #345575;
   text-align:left;color:white
 }
 </style>`;

 const content=`
 <div class="snhl-extra">
  
<section class="snhl-panel" id="snhl-live">
  <h2>🔴 Live Scoreboard</h2>
  <div id="snhl-live-results">
    <div class="snhl-empty">
      Live-Ergebnisse werden geladen …
    </div>
  </div>
</section>


  <div class="snhl-grid">
   <section class="snhl-panel">
    <h2>📺 Twitch Live & Replays</h2>
    <div class="snhl-empty">
     Noch keine offiziellen Streams oder Replays verfügbar.
    </div>
   </section>
   
<section class="snhl-panel">
  <h2>📅 Spielplan</h2>
  <div id="snhl-schedule">
    <div class="snhl-empty">
      Spielplan wird geladen …
    </div>
  </div>
</section>

  </div>

  <div class="snhl-grid">
   <section class="snhl-panel">
    <h2>🏆 Tabellen</h2>
    <table class="snhl-table">
     <thead>
      <tr><th>#</th><th>Club</th><th>Sp.</th><th>Pts.</th></tr>
     </thead>
     <tbody>
      <tr><td colspan="4">Noch keine Tabelle verfügbar.</td></tr>
     </tbody>
    </table>
   </section>
   <section class="snhl-panel">
    <h2>🥅 Spielerstatistiken</h2>
    <div class="snhl-empty">
     Noch keine Spielerstatistiken verfügbar.
    </div>
   </section>
  </div>

  
 
 </div>`;

 if(!/<\/head\s*>/i.test(html) ||
    !/<\/body\s*>/i.test(html))
   throw Error("HTML-Struktur unvollständig");

 html=html.replace(/<\/head\s*>/i,style+"</head>");
 const clubsPosition =
  /<section\b(?=[^>]*\bid=["']clubs["'])[^>]*>/i;

if (!clubsPosition.test(html)) {
  throw Error("Clubbereich nicht gefunden");
}

html = html.replace(clubsPosition, match => content + match);

 
const clubScript = `
<script>
(function () {
  "use strict";

  const SUPABASE_URL =
    "https://avvsnfgdmamhabcyngds.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_xqTS7nztFKXTeyD7W-96QA_-7OCZ7Nt";

  async function loadClubs() {
    const target = document.querySelector("#clubs");

    if (!target) return;

    try {
      const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/public_clubs" +
        "?select=club_id,name,country_code,logo_url,player_count" +
        "&order=name.asc",
        {
          headers: {
            apikey: SUPABASE_KEY
          }
        }
      );

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const clubs = await response.json();

      
const oldDescription = target.querySelector("p");

if (
  oldDescription &&
  oldDescription.textContent.includes(
    "Clubprofile und Anmeldungen"
  )
) {
  oldDescription.remove();
}
const container = document.createElement("div");
      
container.style.display = "grid";
container.style.gridTemplateColumns =
  "repeat(auto-fit,minmax(min(100%,320px),1fr))";
container.style.gap = "12px";
container.style.marginTop = "16px";


      clubs.forEach(club => {
        const card = document.createElement("div");

        card.style.background = "#10233a";
        card.style.border = "1px solid #315b89";
        card.style.borderRadius = "10px";
        
card.style.padding = "14px";
card.style.display = "flex";
card.style.alignItems = "center";
card.style.gap = "14px";
card.style.minHeight = "105px";
card.style.flexWrap = "wrap";


        const name = document.createElement("h3");
        name.textContent = club.name || "Unbenannter Club";

        const count = document.createElement("p");
        const total = Number(club.player_count) || 0;

        count.textContent = total + " aktive Spieler";
        count.style.color =
          total >= 7 && total <= 15
            ? "#70e6a0"
            : "#ff8b8b";

        const country = document.createElement("p");
       
const code = String(club.country_code || "")
  .trim()
  .toUpperCase();

if (/^[A-Z]{2}$/.test(code)) {
  const flag = [...code]
    .map(letter =>
      String.fromCodePoint(
        127397 + letter.charCodeAt(0)
      )
    )
    .join("");

  const countryName = new Intl.DisplayNames(
    ["de"],
    { type: "region" }
  ).of(code);

  country.textContent =
  code === "CH" ? "🇨🇭 Schweiz" : flag + " " + countryName;
} else {
  country.textContent = "Land nicht angegeben";
}


        
const info = document.createElement("div");
info.style.flex = "1";
info.style.minWidth = "160px";

name.style.margin = "0 0 6px";
name.style.fontSize = "17px";

country.style.margin = "0 0 5px";
country.style.fontSize = "13px";

count.style.margin = "0";
count.style.fontSize = "13px";

info.append(name, country, count);
card.appendChild(info);


        if (
          club.logo_url &&
          /^https:\/\//i.test(club.logo_url)
        ) {
          const logo = document.createElement("img");
          logo.src = club.logo_url;
          logo.alt = "Clublogo";
          
logo.style.width = "68px";
logo.style.height = "68px";
logo.style.flexShrink = "0";

          logo.style.objectFit = "contain";
          card.prepend(logo);
        }

        container.appendChild(card);
      });

      if (!clubs.length) {
        const message = document.createElement("p");
        message.textContent = "Noch keine Clubs vorhanden.";
        container.appendChild(message);
      }

      target.appendChild(container);

    } catch (error) {
      console.error("Clubdaten konnten nicht geladen werden:", error);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", loadClubs);
  } else {
    loadClubs();
  }
})();
<\/script>`;

html = html.replace(
  /<\/body\s*>/i,
  clubScript + "</body>"
);

/* Swiss NHL League – Spielplan aus Supabase */

const scheduleCode = `
(function () {
  "use strict";

  const URL =
    "https://avvsnfgdmamhabcyngds.supabase.co";

  const KEY =
    "sb_publishable_xqTS7nztFKXTeyD7W-96QA_-7OCZ7Nt";

  async function loadSchedule() {
    const target = document.querySelector(
      "#snhl-schedule"
    );

    if (!target) return;

    target.textContent = "Spielplan wird geladen …";

    try {
      const headers = { apikey: KEY };

      const [gamesResponse, clubsResponse] =
        await Promise.all([
          fetch(
            URL + "/rest/v1/games" +
            "?select=id,season,game_mode,home_club_id," +
            "away_club_id,scheduled_at,status,match_type" +
            "&order=scheduled_at.asc",
            { headers }
          ),
          fetch(
            URL + "/rest/v1/public_clubs" +
            "?select=club_id,name",
            { headers }
          )
        ]);

      if (!gamesResponse.ok ||
          !clubsResponse.ok) {
        throw new Error(
          "Spieldaten konnten nicht geladen werden"
        );
      }

      const games = await gamesResponse.json();
      const clubs = await clubsResponse.json();

      const names = new Map(
        clubs.map(c => [c.club_id, c.name])
      );

      target.replaceChildren();

      if (!games.length) {
        target.textContent =
          "Noch keine Spiele veröffentlicht.";
        return;
      }

      games.forEach(game => {
        const card = document.createElement("article");
        card.style.background = "#10233a";
        card.style.border = "1px solid #315b89";
        card.style.borderRadius = "9px";
        card.style.padding = "15px";
        card.style.marginBottom = "12px";

        const title = document.createElement("strong");
        title.textContent =
          (names.get(game.home_club_id) || "Heimclub") +
          " vs. " +
          (names.get(game.away_club_id) || "Gastclub");

        const info = document.createElement("p");
        const date = new Date(game.scheduled_at);

        const formattedDate =
          new Intl.DateTimeFormat("de-CH", {
            timeZone: "Europe/Zurich",
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          }).format(date);

        info.textContent =
          formattedDate + " Uhr · " +
          game.game_mode + " · " +
          (game.match_type === "friendly"
            ? "Testspiel"
            : "Meisterschaft") +
          " · " +
          (game.status === "scheduled"
            ? "Geplant"
            : game.status);

        info.style.color = "#b9d2ed";
        info.style.marginBottom = "0";

        card.append(title, info);
        target.appendChild(card);
      });

    } catch (error) {
      target.textContent =
        "Spielplan konnte nicht geladen werden.";
      console.error(error);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      loadSchedule
    );
  } else {
    loadSchedule();
  }
})();
`;

const scheduleScript =
  "<scr" + "ipt>" +
  scheduleCode +
  "</scr" + "ipt>";

html = html.replace(
  /<\/body\s*>/i,
  () => scheduleScript + "</body>"
);

/* Swiss NHL League – Live Scoreboard */

const liveCode = `
(function () {
  "use strict";

  const URL =
    "https://avvsnfgdmamhabcyngds.supabase.co";

  const KEY =
    "sb_publishable_xqTS7nztFKXTeyD7W-96QA_-7OCZ7Nt";

  async function loadLiveScores() {
    const target = document.getElementById(
      "snhl-live-results"
    );

    if (!target) return;

    try {
      const headers = { apikey: KEY };

      const [gamesResponse, clubsResponse] =
        await Promise.all([
          fetch(
            URL + "/rest/v1/games" +
            "?select=id,game_mode,home_club_id," +
            "away_club_id,home_score,away_score," +
            "status,scheduled_at,decision_type" +
            "&status=in.(in_progress,completed)" +
            "&order=scheduled_at.desc&limit=20",
            { headers }
          ),
          fetch(
            URL + "/rest/v1/public_clubs" +
            "?select=club_id,name",
            { headers }
          )
        ]);

      if (!gamesResponse.ok || !clubsResponse.ok) {
        throw new Error("Daten konnten nicht geladen werden");
      }

      const games = await gamesResponse.json();
      const clubs = await clubsResponse.json();

      const names = new Map(
        clubs.map(c => [c.club_id, c.name])
      );

      
if (
  new URLSearchParams(location.search).get("simulation") === "1"
) return;
target.replaceChildren();

      if (!games.length) {
        const empty = document.createElement("div");
        empty.className = "snhl-empty";
        empty.textContent =
          "Aktuell keine laufenden oder abgeschlossenen Spiele.";
        target.appendChild(empty);
        return;
      }

      games.forEach(game => {
        const card = document.createElement("article");
        card.style.background = "#10233a";
        card.style.border = "1px solid #315b89";
        card.style.borderRadius = "9px";
        card.style.padding = "16px";
        card.style.marginBottom = "12px";

        const heading = document.createElement("strong");
        heading.textContent =
          (names.get(game.home_club_id) || "Heimclub") +
          " vs. " +
          (names.get(game.away_club_id) || "Gastclub");

        const score = document.createElement("p");

        if (
          game.home_score != null &&
          game.away_score != null
        ) {
          score.textContent =
            game.home_score + " : " + game.away_score;
        } else {
          score.textContent = "Noch kein Spielstand";
        }

        score.style.fontSize = "24px";
        score.style.fontWeight = "bold";
        score.style.margin = "12px 0";

        const status = document.createElement("p");
        status.textContent =
          game.status === "in_progress"
            ? "🔴 LIVE"
            : "Beendet" +
              (game.decision_type
                ? " · " + game.decision_type
                : "");

        status.style.color =
          game.status === "in_progress"
            ? "#ff7474"
            : "#a9c8e8";

        card.append(heading, score, status);
        target.appendChild(card);
      });

    } catch (error) {
      target.textContent =
        "Live-Ergebnisse konnten nicht geladen werden.";
      console.error(error);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      loadLiveScores
    );
  } else {
    loadLiveScores();
  }

  setInterval(loadLiveScores, 5000);
})();
`;

const liveScript =
  "<scr" + "ipt>" +
  liveCode +
  "</scr" + "ipt>";

html = html.replace(
  /<\/body\s*>/i,
  () => liveScript + "</body>"
);

/* Swiss NHL League – isolierter Live-Anzeigetest */

const simulationCode = `
(function () {
  "use strict";

  const params = new URLSearchParams(location.search);

  // Simulation nur bei ?simulation=1
  if (params.get("simulation") !== "1") return;

  const target = document.getElementById(
    "snhl-live-results"
  );

  if (!target) return;

  let homeScore = 2;
  let awayScore = 1;
  let seconds = 0;

  // Eigener Testbereich statt Änderung echter Daten
  const test = document.createElement("article");
  test.style.cssText =
    "background:#10233a;border:2px solid #ffb347;" +
    "border-radius:12px;padding:18px;margin-bottom:12px";

  const heading = document.createElement("h3");
  heading.textContent =
    "TESTSIMULATION – kein echtes Ligaspiel";
  heading.style.color = "#ffcf88";

  const teams = document.createElement("p");
  teams.textContent =
    "Swiss NHL Testclub 2 vs. Swiss NHL Testclub Zürich";

  const score = document.createElement("h2");
  const timer = document.createElement("p");
  const status = document.createElement("p");
  status.textContent = "🔴 SIMULATION";
  status.style.color = "#ff8b8b";

  const button = document.createElement("button");
  button.textContent = "Testtor Heimclub +1";
  button.style.cssText =
    "background:#1683ff;color:white;border:0;" +
    "border-radius:8px;padding:12px;cursor:pointer";

  function render() {
    score.textContent = homeScore + " : " + awayScore;
    timer.textContent =
      "Testzeit: " + seconds + " Sekunden";
  }

  button.addEventListener("click", function () {
    homeScore++;
    render();
  });

  test.append(
    heading, teams, score, timer, status, button
  );

  target.prepend(test);
  render();

  const interval = setInterval(function () {
    if (!test.isConnected) {
      clearInterval(interval);
      return;
    }
    seconds += 5;
    render();
  }, 5000);
})();
`;

const simulationScript =
  "<scr" + "ipt>" +
  simulationCode +
  "</scr" + "ipt>";

html = html.replace(
  /<\/body\s*>/i,
  () => simulationScript + "</body>"
);
document.open();
 document.write(html);
 document.close();

}catch(error){
 document.getElementById("loading").textContent=
  "Fehler beim Laden: "+error.message;
}
})();
</script>
</body>
</html>
