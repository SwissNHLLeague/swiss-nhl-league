
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Swiss NHL League</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07101d;color:white;font-family:Arial,sans-serif}
header{padding:24px;text-align:center;background:#11243e;border-bottom:2px solid #087cff}
h1{margin:0;font-size:27px}
h1 span{color:#1683ff}
header p{font-size:12px;letter-spacing:3px;color:#b6c8dd}
main{max-width:430px;margin:45px auto;padding:20px}
.panel{background:#101d30;border:1px solid #294c72;border-radius:14px;padding:25px}
h2{text-align:center;margin-top:0}
.tabs{display:flex;gap:10px;margin-bottom:25px}
button{cursor:pointer;font:inherit}
.tab{flex:1;padding:12px;background:#192b43;color:white;border:1px solid #34516e;border-radius:7px}
.tab.active,.submit{background:#087cff;color:white;border:0}
label{display:block;margin:16px 0 7px}
input,select{width:100%;padding:13px;border-radius:7px;border:1px solid #46617d;background:#071321;color:white;font-size:16px}
.submit{width:100%;padding:14px;border-radius:7px;margin-top:22px;font-weight:bold}
.submit:disabled{opacity:.6}
#message{margin-top:20px;line-height:1.5;text-align:center;overflow-wrap:anywhere}
#sessionArea{display:none;text-align:center}
#sessionEmail{overflow-wrap:anywhere;color:#b6c8dd}
#logoutBtn{background:#192b43;color:white;border:1px solid #46617d;border-radius:7px;padding:13px;width:100%;margin-top:15px}
a{color:#65adff}
footer{text-align:center;padding:20px;font-size:12px;color:#8ba3bc}
</style>
</head>
<body>
<header>
<h1>SWISS <span>NHL</span> LEAGUE</h1>
<p>NHL 27 | PLAYSTATION 5</p>
</header>
<main>
<div class="panel">
<h2 id="heading">Login</h2>

<div id="sessionArea">
  <p>Du bist angemeldet als:</p>
  <p id="sessionEmail"></p>
  <button id="logoutBtn" type="button">Abmelden</button>
</div>

<div id="authArea">
<div class="tabs">
<button class="tab active" id="loginTab" type="button">Login</button>
<button class="tab" id="registerTab" type="button">Registrieren</button>
</div>

<form id="authForm">
<div id="nameFields" style="display:none">
<label for="firstName">Vorname</label>
<input id="firstName" type="text" autocomplete="given-name">
<label for="lastName">Nachname</label>
<input id="lastName" type="text" autocomplete="family-name">
</div>

<label for="email">E-Mail-Adresse</label>
<input id="email" type="email" autocomplete="email" required>

<label for="password">Passwort</label>
<input id="password" type="password" minlength="12" autocomplete="current-password" required>

<div id="platformFields" style="display:none">
<label for="platform">Gaming-Plattform</label>
<select id="platform">
<option value="PS5">PlayStation 5</option>
<option value="Xbox">Xbox Series X/S</option>
</select>
<label for="gamerId" id="gamerLabel">PSN-Online-ID</label>
<input id="gamerId" type="text" placeholder="Deine PSN-ID">
</div>

<button class="submit" id="submitBtn" type="submit">Einloggen</button>
</form>

<p id="forgotArea" style="text-align:center;margin-top:18px">
<a href="#" id="forgotLink">Passwort vergessen?</a>
</p>
</div>

<div id="message" role="status" aria-live="polite"></div>

<p style="text-align:center;margin-top:25px">
<a href="./">Zurück zur Startseite</a>
</p>
</div>
</main>

<footer>© Swiss NHL League | EST. 2022</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL =
  "https://avvsnfgdmamhabcyngds.supabase.co";
const SUPABASE_KEY =
  "sb_publishable_xqTS7nztFKXTeyD7W-96QA_-7OCZ7Nt";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

let mode = "login";

const $ = id => document.getElementById(id);
const message = $("message");
const submitBtn = $("submitBtn");

function showSession(user) {
  const loggedIn = Boolean(user);

  $("sessionArea").style.display =
    loggedIn ? "block" : "none";

  $("authArea").style.display =
    loggedIn ? "none" : "block";

  $("sessionEmail").textContent =
    user?.email || "";

  $("heading").textContent =
    loggedIn ? "Mein Konto" :
    mode === "login" ? "Login" : "Registrieren";

  if (loggedIn) {
    $("password").value = "";
  }
}

async function checkSession() {
  try {
    const { data, error } =
      await client.auth.getUser();

    if (error) {
      showSession(null);
      return;
    }

    showSession(data.user);
  } catch (error) {
    showSession(null);
    message.textContent =
      "Sitzung konnte nicht geprüft werden.";
  }
}

function setMode(next) {
  mode = next;

  const registering = next === "register";

  $("nameFields").style.display =
    registering ? "block" : "none";

  $("platformFields").style.display =
    registering ? "block" : "none";

  $("firstName").required = registering;
  $("lastName").required = registering;
  $("gamerId").required = registering;

  $("heading").textContent =
    registering ? "Registrieren" : "Login";

  submitBtn.textContent =
    registering ? "Konto erstellen" : "Einloggen";

  $("password").autocomplete =
    registering ? "new-password" : "current-password";

  $("loginTab").classList.toggle(
    "active", !registering
  );

  $("registerTab").classList.toggle(
    "active", registering
  );

  $("forgotArea").style.display =
    registering ? "none" : "block";

  message.textContent = "";
}

$("platform").addEventListener("change", () => {
  const xbox = $("platform").value === "Xbox";

  $("gamerLabel").textContent =
    xbox ? "Xbox-Gamertag" : "PSN-Online-ID";

  $("gamerId").placeholder =
    xbox ? "Dein Xbox-Gamertag" : "Deine PSN-ID";
});

$("loginTab").onclick = () => setMode("login");
$("registerTab").onclick = () => setMode("register");

$("forgotLink").addEventListener("click", async event => {
  event.preventDefault();

  const email = $("email").value.trim();

  if (!email) {
    message.textContent =
      "Bitte zuerst deine E-Mail-Adresse eingeben.";
    $("email").focus();
    return;
  }

  message.textContent =
    "Wiederherstellungs-E-Mail wird angefordert ...";

  try {
    const { error } =
      await client.auth.resetPasswordForEmail(email, {
        redirectTo: new URL(
          "reset-password.html",
          window.location.href
        ).href
      });

    if (error) throw error;

    message.textContent =
      "Falls ein Konto existiert, erhältst du eine E-Mail. Bitte auch den Spam-Ordner prüfen.";
  } catch (error) {
    message.textContent =
      "Passwort-Zurücksetzen konnte nicht gestartet werden.";
  }
});

$("authForm").onsubmit = async event => {
  event.preventDefault();

  submitBtn.disabled = true;
  message.textContent = "Bitte warten ...";

  const email = $("email").value.trim();
  const password = $("password").value;

  try {
    let result;

    if (mode === "register") {
      const firstName = $("firstName").value.trim();
      const lastName = $("lastName").value.trim();
      const platform = $("platform").value;
      const gamerId = $("gamerId").value.trim();

      if (!firstName || !lastName || !gamerId) {
        throw new Error(
          "Bitte alle Registrierungsfelder ausfüllen."
        );
      }

      result = await client.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: window.location.href,
          data: {
            first_name: firstName,
            last_name: lastName,
            platform,
            gamer_id: gamerId
          }
        }
      });
    } else {
      result = await client.auth.signInWithPassword({
        email,
        password
      });
    }

    if (result.error) throw result.error;

    if (mode === "register") {
      message.textContent =
        "Registrierung eingereicht. Prüfe deine E-Mails zur Bestätigung.";

      if (result.data?.session) {
        showSession(result.data.user);
      }
    } else {
      if (!result.data?.user ||
          !result.data?.session) {
        throw new Error(
          "Keine gültige Sitzung erhalten."
        );
      }

      showSession(result.data.user);
      message.textContent =
        "Erfolgreich eingeloggt!";
    }
  } catch (error) {
    message.textContent =
      error.message || "Ein Fehler ist aufgetreten.";
  } finally {
    $("password").value = "";
    submitBtn.disabled = false;
  }
};

$("logoutBtn").onclick = async () => {
  $("logoutBtn").disabled = true;

  try {
    const { error } = await client.auth.signOut();
    if (error) throw error;

    showSession(null);
    message.textContent =
      "Erfolgreich abgemeldet.";
  } catch (error) {
    message.textContent =
      "Abmeldung fehlgeschlagen. Bitte erneut versuchen.";
  } finally {
    $("logoutBtn").disabled = false;
  }
};

client.auth.onAuthStateChange((_event, session) => {
  showSession(session?.user || null);
});

checkSession();
</script>
</body>
</html>
