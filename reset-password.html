<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passwort zurücksetzen | Swiss NHL League</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101d;color:#fff;font-family:Arial,sans-serif}
header{padding:34px 12px;text-align:center;background:#14243e;border-bottom:3px solid #3478f6}
h1{font-size:27px;margin:0}h1 span{color:#3478f6}header p{color:#aebdd3;letter-spacing:2px}
main{max-width:460px;margin:50px auto;padding:18px}.panel{padding:28px;background:#111e33;border:1px solid #355477;border-radius:15px}
h2{text-align:center}label{display:block;margin:18px 0 8px}input{width:100%;padding:14px;border:1px solid #496482;border-radius:8px;background:#071321;color:white;font-size:16px}
button{width:100%;margin-top:25px;padding:15px;border:0;border-radius:8px;background:#3478f6;color:white;font-size:17px;font-weight:bold}button:disabled{opacity:.5}
#message{margin-top:20px;line-height:1.5;text-align:center}a{color:#77b1ff}footer{text-align:center;padding:30px;color:#9eacc3}
</style>
</head>
<body>
<header><h1>SWISS <span>NHL</span> LEAGUE</h1><p>PASSWORT ZURÜCKSETZEN</p></header>
<main><div class="panel"><h2>Neues Passwort</h2>
<form id="resetForm">
<label for="password">Neues Passwort</label><input id="password" type="password" autocomplete="new-password" minlength="12" required>
<label for="confirmPassword">Passwort bestätigen</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
<button id="saveBtn" type="submit" disabled>Passwort speichern</button>
</form><p id="message" role="status">Wiederherstellungslink wird geprüft ...</p>
<p style="text-align:center"><a href="login.html">Zur Anmeldung</a></p>
</div></main><footer>© Swiss NHL League | EST. 2022</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://avvsnfgdmamhabcyngds.supabase.co";
const SUPABASE_KEY = "sb_publishable_xqTS7nztFKXTeyD7W-96QA_-7OCZ7Nt";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{detectSessionInUrl:true,persistSession:true}});
const message = document.getElementById("message");
const saveBtn = document.getElementById("saveBtn");
let recoveryReady = false;
function ready(){recoveryReady=true;saveBtn.disabled=false;message.textContent="Du kannst jetzt ein neues Passwort festlegen.";}
client.auth.onAuthStateChange((event) => {if(event === "PASSWORD_RECOVERY") ready();});
async function initialize(){
 try {
  const q = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.substring(1));
  if(q.get("error") || hash.get("error")){throw new Error(q.get("error_description") || hash.get("error_description") || "Link ungültig oder abgelaufen.");}
  if(q.get("token_hash") && q.get("type") === "recovery"){
   const {error}=await client.auth.verifyOtp({token_hash:q.get("token_hash"),type:"recovery"});
   if(error)throw error;
   ready();
  }else if(hash.get("type") === "recovery" && hash.get("access_token")){
   const {error}=await client.auth.setSession({access_token:hash.get("access_token"),refresh_token:hash.get("refresh_token") || ""});
   if(error)throw error;
   ready();
  }else if(q.get("code")){
   const {error}=await client.auth.exchangeCodeForSession(q.get("code"));
   if(error)throw error;
   ready();
  }
  if(recoveryReady){history.replaceState(null,"",location.pathname);}
  else message.textContent="Bitte öffne diese Seite über einen neuen Passwort-Wiederherstellungslink.";
 }catch(e){message.textContent="Fehler: "+e.message;}
}
document.getElementById("resetForm").addEventListener("submit",async e=>{
 e.preventDefault();if(!recoveryReady)return;
 const password=document.getElementById("password").value;
 if(password!==document.getElementById("confirmPassword").value){message.textContent="Die Passwörter stimmen nicht überein.";return;}
 saveBtn.disabled=true;message.textContent="Passwort wird gespeichert ...";
 const {error}=await client.auth.updateUser({password});
 if(error){message.textContent=error.message;saveBtn.disabled=false;return;}
 message.textContent="Passwort geändert! Du kannst dich jetzt anmelden.";
 document.getElementById("resetForm").reset();recoveryReady=false;
 await client.auth.signOut();
});
initialize();
</script>
</body>
</html>
