
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Swiss NHL League – Sicherheitstest</title>
  <style>
    body {
      background: #080f20;
      color: white;
      font-family: Arial, sans-serif;
      padding: 25px;
    }
    main {
      max-width: 600px;
      margin: 50px auto;
      padding: 25px;
      background: #1a2741;
      border-radius: 18px;
    }
    button {
      background: #4278e9;
      color: white;
      border: 0;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h1>Swiss NHL League</h1>
  <h2>Spieleranfragen-Sicherheitstest</h2>
  <p id="account">Anmeldung wird geprüft...</p>
  <p>
    Dieser Test verwendet eine nicht vorhandene
    Anfrage-ID. Es werden keine Anfragen verändert.
  </p>
  <button id="test" disabled>
    API-Verbindung testen
  </button>
  <pre id="result"></pre>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

const SUPABASE_URL =
  "https://avvsnfgdmamhabcyngds.supabase.co";

const SUPABASE_KEY =
  sb_publishable_xqTS7nztFKXTeyD7W-96QA_-7OCZ7Nt

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const account = document.getElementById("account");
const result = document.getElementById("result");
const button = document.getElementById("test");

async function start() {
  const {data, error} = await client.auth.getUser();

  if (error || !data.user) {
    account.textContent = "Nicht angemeldet";
    return;
  }

  account.textContent =
    "Angemeldet: " + data.user.email;

  if (
    data.user.email !==
    "cyril-schuhmacher19@gmx.net"
  ) {
    result.textContent =
      "Falsches Testkonto. Test gesperrt.";
    return;
  }

  button.disabled = false;
}

button.addEventListener("click", async () => {
  button.disabled = true;
  result.textContent = "Test läuft...";

  const {data, error} = await client.rpc(
    "review_player_request",
    {
      p_request_id:
        "00000000-0000-0000-0000-000000000000",
      p_approve: true
    }
  );

  result.textContent = JSON.stringify(
    {data, error},
    null,
    2
  );
  button.disabled = false;
});

start();
</script>
</body>
</html>
