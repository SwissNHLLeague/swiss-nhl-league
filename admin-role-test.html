
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Swiss NHL League – Rollentest</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #080f1e;
      color: white;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 500px;
      margin: 60px auto;
      padding: 25px;
      background: #152239;
      border: 1px solid #3b5d91;
      border-radius: 14px;
    }
    button {
      width: 100%;
      padding: 16px;
      background: #397bf0;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }
    button:disabled { opacity: .5; }
    #result { margin-top: 20px; }
  </style>
</head>
<body>
  <main>
    <h2>Swiss NHL League</h2>
    <p>Sicherheitstest – Liga-Leitung</p>
    <p id="account">Anmeldung wird geprüft...</p>

    <button id="test" disabled>
      Admin-Berechtigung testen
    </button>

    <p id="result"></p>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const url =
      "https://avvsnfgdmamhabcyngds.supabase.co";

    const key =
      "sb_publishable_xqTS7nztFKXTeyD7W-96QA_-7OCZ7Nt";

    const client = createClient(url, key);

    const account = document.getElementById("account");
    const button = document.getElementById("test");
    const result = document.getElementById("result");

    const { data, error } =
      await client.auth.getUser();

    if (error || !data.user) {
      account.textContent = "Nicht angemeldet.";
    } else {
      account.textContent =
        "Angemeldet: " + data.user.email;

      if (
        data.user.email?.toLowerCase() ===
        "cyril-schuhmacher@hotmail.com"
      ) {
        button.disabled = false;
      } else {
        result.textContent =
          "Bitte das Hotmail-Testkonto verwenden.";
      }
    }

    button.addEventListener("click", async () => {
      button.disabled = true;
      result.textContent = "Sicherheitstest läuft...";

      try {
        const { data: sessionData } =
          await client.auth.getSession();

        const token =
          sessionData.session?.access_token;

        if (!token) {
          result.textContent =
            "Keine gültige Anmeldung gefunden.";
          return;
        }

        const response = await fetch(
          url + "/functions/v1/send-admin-invitation",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + token,
              "apikey": key
            },
            // Absichtlich ungültige Daten:
            // Es darf keine Einladung entstehen.
            body: JSON.stringify({
              email: "ungueltig",
              role: "ungueltig"
            })
          }
        );

        if (response.status === 403) {
          result.textContent =
            "HTTP 403 – Liga-Leitung korrekt blockiert.";
        } else {
          result.textContent =
            "HTTP " + response.status +
            " – Ergebnis muss geprüft werden.";
        }
      } catch {
        result.textContent =
          "Verbindungsfehler beim Test.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
