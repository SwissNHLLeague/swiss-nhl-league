
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">
<title>Swiss NHL League – GM-Test</title>
<style>
body{
 background:#08111f;
 color:white;
 font-family:Arial,sans-serif;
 padding:20px;
}
main{
 max-width:600px;
 margin:40px auto;
 background:#17243d;
 padding:25px;
 border-radius:15px;
}
button{
 background:#3979ed;
 color:white;
 border:0;
 border-radius:8px;
 padding:15px;
 font-size:16px;
}
pre{
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
</style>
</head>
<body>
<main>
<h1>Swiss NHL League</h1>
<h2>GM-Sicherheitstest</h2>
<p id="account">Anmeldung wird geprüft ...</p>
<p>Dieser Test verwendet eine ungültige
Club-ID. Es wird kein GM ernannt.</p>
<button id="test" disabled>
Berechtigung testen
</button>
<pre id="result"></pre>
</main>

<script type="module">
import {createClient} from
"https://esm.sh/@supabase/supabase-js@2";

const url =
"https://avvsnfgdmamhabcyngds.supabase.co";

const key = "sb_publishable_xqTS7nztFKXTeyD7W-96QA_-7OCZ7Nt";

const client=createClient(url,key);

const account=document.getElementById("account");
const button=document.getElementById("test");
const result=document.getElementById("result");

const {data:{session}}=
 await client.auth.getSession();

if(!session){
 account.textContent="Nicht angemeldet";
}else{
 account.textContent=
 "Angemeldet: "+session.user.email;
 button.disabled=false;
}

button.onclick=async()=>{
 button.disabled=true;
 result.textContent="Test läuft ...";

 const {data,error}=await client.rpc(
  "snhl_assign_club_gm",
  {
      
p_club_id:
  "1b84ecea-0c76-42bd-a4bd-a47f43c7ea4b",

   p_user_id:session.user.id
  }
 );

 result.textContent=JSON.stringify(
  {data,error},
  null,2
 );

 button.disabled=false;
};
</script>
</body>
</html>
